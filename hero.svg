<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d1033"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animated dash pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes pulse-slow { 0%,100% { opacity: 0.2; } 50% { opacity: 0.6; } }
    @keyframes orbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes orbit-r { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes dash-flow { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
    @keyframes dash-flow-r { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
    @keyframes float-y { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes float-y2 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(6px); } }
    @keyframes scale-pulse { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes ripple { 0% { r: 8; opacity: 0.6; } 100% { r: 28; opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-200px); opacity: 0; } 10% { opacity: 0.15; } 90% { opacity: 0.15; } 100% { transform: translateY(200px); opacity: 0; } }
    @keyframes typewriter { 0% { width: 0; } 100% { width: 100%; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes particle-up { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 100% { transform: translateY(-60px) scale(0); opacity: 0; } }
    @keyframes particle-up2 { 0% { transform: translateY(0) scale(1); opacity: 0.6; } 100% { transform: translateY(-80px) scale(0); opacity: 0; } }
    @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes glow-breathe { 0%,100% { filter: drop-shadow(0 0 4px #3b82f6); } 50% { filter: drop-shadow(0 0 12px #8b5cf6); } }

    .grid-bg { animation: fade-in 2s ease-out; }
    .conn { stroke-dasharray: 6 6; animation: dash-flow 1.5s linear infinite; }
    .conn-r { stroke-dasharray: 6 6; animation: dash-flow-r 2s linear infinite; }
    .node-pulse { animation: pulse 3s ease-in-out infinite; }
    .node-pulse-d { animation: pulse 3s ease-in-out 0.5s infinite; }
    .node-pulse-d2 { animation: pulse 3s ease-in-out 1s infinite; }
    .float { animation: float-y 4s ease-in-out infinite; }
    .float-d { animation: float-y 4s ease-in-out 1.5s infinite; }
    .float-d2 { animation: float-y2 5s ease-in-out 0.8s infinite; }
    .scale-p { animation: scale-pulse 4s ease-in-out infinite; }
    .ripple { animation: ripple 3s ease-out infinite; }
    .ripple-d { animation: ripple 3s ease-out 1s infinite; }
    .ripple-d2 { animation: ripple 3s ease-out 2s infinite; }
    .scan-line { animation: scan 6s linear infinite; }
    .blink { animation: blink 1s step-end infinite; }
    .particle { animation: particle-up 3s ease-out infinite; }
    .particle-d { animation: particle-up2 4s ease-out 1s infinite; }
    .particle-d2 { animation: particle-up 3.5s ease-out 2s infinite; }
    .glow-b { animation: glow-breathe 4s ease-in-out infinite; }
    .orbit-ring { animation: orbit 20s linear infinite; transform-origin: 400px 210px; }
    .orbit-ring-r { animation: orbit-r 30s linear infinite; transform-origin: 400px 210px; }
  </style>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)" class="grid-bg" opacity="0.5"/>

  <!-- Scanning line -->
  <rect class="scan-line" x="0" width="800" height="2" fill="url(#glow-blue)" opacity="0.15"/>

  <!-- Central glow -->
  <circle cx="400" cy="210" r="120" fill="url(#center-glow)" class="scale-p"/>

  <!-- Orbital rings -->
  <g class="orbit-ring" opacity="0.15">
    <ellipse cx="400" cy="210" rx="160" ry="80" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="4 8"/>
  </g>
  <g class="orbit-ring-r" opacity="0.1">
    <ellipse cx="400" cy="210" rx="220" ry="110" fill="none" stroke="#8b5cf6" stroke-width="0.5" stroke-dasharray="4 12"/>
  </g>

  <!-- Connection lines from center hub to agent nodes -->
  <!-- CEO (top center) -->
  <line x1="400" y1="210" x2="400" y2="110" stroke="#3b82f6" stroke-width="1" opacity="0.4" class="conn"/>
  <!-- CTO (left) -->
  <line x1="400" y1="210" x2="220" y2="180" stroke="#8b5cf6" stroke-width="1" opacity="0.4" class="conn-r"/>
  <!-- Designer (right) -->
  <line x1="400" y1="210" x2="580" y2="180" stroke="#22c55e" stroke-width="1" opacity="0.4" class="conn"/>
  <!-- Engineer 1 (bottom-left) -->
  <line x1="400" y1="210" x2="260" y2="300" stroke="#3b82f6" stroke-width="1" opacity="0.4" class="conn-r"/>
  <!-- Engineer 2 (bottom-right) -->
  <line x1="400" y1="210" x2="540" y2="300" stroke="#8b5cf6" stroke-width="1" opacity="0.4" class="conn"/>

  <!-- Inter-agent connections -->
  <line x1="220" y1="180" x2="260" y2="300" stroke="#3b82f6" stroke-width="0.5" opacity="0.2" class="conn"/>
  <line x1="580" y1="180" x2="540" y2="300" stroke="#22c55e" stroke-width="0.5" opacity="0.2" class="conn-r"/>
  <line x1="260" y1="300" x2="540" y2="300" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2" class="conn"/>
  <line x1="220" y1="180" x2="580" y2="180" stroke="#3b82f6" stroke-width="0.5" opacity="0.15" class="conn-r"/>

  <!-- ===== CENTRAL HUB ===== -->
  <g class="float">
    <!-- Hub ripples -->
    <circle cx="400" cy="210" r="8" fill="none" stroke="#8b5cf6" stroke-width="1" class="ripple"/>
    <circle cx="400" cy="210" r="8" fill="none" stroke="#8b5cf6" stroke-width="1" class="ripple-d"/>
    <circle cx="400" cy="210" r="8" fill="none" stroke="#8b5cf6" stroke-width="1" class="ripple-d2"/>
    <!-- Hub core -->
    <circle cx="400" cy="210" r="18" fill="#0d1033" stroke="#8b5cf6" stroke-width="1.5" class="glow-b"/>
    <circle cx="400" cy="210" r="12" fill="#1e1b4b" opacity="0.8"/>
    <circle cx="400" cy="210" r="6" fill="#8b5cf6" class="node-pulse"/>
    <!-- Hub label -->
    <text x="400" y="248" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="9" opacity="0.7">mission control</text>
  </g>

  <!-- ===== AGENT: CEO (top center) ===== -->
  <g class="float-d">
    <circle cx="400" cy="104" r="24" fill="url(#node-glow)" opacity="0.5"/>
    <circle cx="400" cy="104" r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="400" cy="104" r="6" fill="#3b82f6" class="node-pulse"/>
    <text x="400" y="108" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="8">👑</text>
    <text x="400" y="84" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="9" font-weight="bold">CEO</text>
    <!-- Status indicator -->
    <circle cx="412" cy="93" r="3" fill="#22c55e" class="node-pulse-d">
      <title>thinking</title>
    </circle>
  </g>

  <!-- ===== AGENT: CTO (left) ===== -->
  <g class="float-d2">
    <circle cx="220" cy="175" r="24" fill="url(#node-glow)" opacity="0.5"/>
    <circle cx="220" cy="175" r="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="220" cy="175" r="6" fill="#8b5cf6" class="node-pulse-d"/>
    <text x="220" y="179" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="8">⚡</text>
    <text x="220" y="155" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="9" font-weight="bold">CTO</text>
    <circle cx="232" cy="164" r="3" fill="#eab308" class="node-pulse-d2">
      <title>delegating</title>
    </circle>
  </g>

  <!-- ===== AGENT: Designer (right) ===== -->
  <g class="float">
    <circle cx="580" cy="175" r="24" fill="url(#node-glow)" opacity="0.5"/>
    <circle cx="580" cy="175" r="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="580" cy="175" r="6" fill="#22c55e" class="node-pulse-d2"/>
    <text x="580" y="179" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="8">🎨</text>
    <text x="580" y="155" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9" font-weight="bold">DESIGN</text>
    <circle cx="592" cy="164" r="3" fill="#22c55e" class="node-pulse">
      <title>active</title>
    </circle>
  </g>

  <!-- ===== AGENT: Engineer 1 (bottom-left) ===== -->
  <g class="float-d">
    <circle cx="260" cy="296" r="24" fill="url(#node-glow)" opacity="0.5"/>
    <circle cx="260" cy="296" r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="260" cy="296" r="6" fill="#3b82f6" class="node-pulse"/>
    <text x="260" y="300" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="8">🔧</text>
    <text x="260" y="276" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="9" font-weight="bold">ENG-1</text>
    <circle cx="272" cy="285" r="3" fill="#3b82f6" class="node-pulse-d">
      <title>coding</title>
    </circle>
  </g>

  <!-- ===== AGENT: Engineer 2 (bottom-right) ===== -->
  <g class="float-d2">
    <circle cx="540" cy="296" r="24" fill="url(#node-glow)" opacity="0.5"/>
    <circle cx="540" cy="296" r="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="540" cy="296" r="6" fill="#8b5cf6" class="node-pulse-d2"/>
    <text x="540" y="300" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold" font-size="8">🔧</text>
    <text x="540" y="276" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="9" font-weight="bold">ENG-2</text>
    <circle cx="552" cy="285" r="3" fill="#22c55e" class="node-pulse">
      <title>reviewing</title>
    </circle>
  </g>

  <!-- ===== DATA PARTICLES ===== -->
  <!-- Rising particles from hub -->
  <circle cx="395" cy="200" r="1.5" fill="#3b82f6" class="particle"/>
  <circle cx="405" cy="205" r="1" fill="#8b5cf6" class="particle-d"/>
  <circle cx="398" cy="215" r="1.5" fill="#22c55e" class="particle-d2"/>
  <circle cx="402" cy="208" r="1" fill="#3b82f6" class="particle"/>

  <!-- Particles near agents -->
  <circle cx="225" cy="170" r="1" fill="#8b5cf6" class="particle-d"/>
  <circle cx="575" cy="170" r="1" fill="#22c55e" class="particle"/>
  <circle cx="265" cy="290" r="1" fill="#3b82f6" class="particle-d2"/>
  <circle cx="535" cy="290" r="1" fill="#8b5cf6" class="particle"/>

  <!-- ===== MINI CODE BLOCK (left panel) ===== -->
  <g opacity="0.6">
    <rect x="40" y="95" width="120" height="75" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
    <rect x="40" y="95" width="120" height="14" rx="4" fill="#1e293b"/>
    <circle cx="50" cy="102" r="2.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="58" cy="102" r="2.5" fill="#eab308" opacity="0.8"/>
    <circle cx="66" cy="102" r="2.5" fill="#22c55e" opacity="0.8"/>
    <text x="48" y="121" fill="#64748b" font-family="monospace" font-size="7">async</text>
    <text x="74" y="121" fill="#c084fc" font-family="monospace" font-size="7">deploy</text>
    <text x="101" y="121" fill="#64748b" font-family="monospace" font-size="7">() {</text>
    <text x="52" y="131" fill="#93c5fd" font-family="monospace" font-size="7">await</text>
    <text x="80" y="131" fill="#e2e8f0" font-family="monospace" font-size="7">agent</text>
    <text x="52" y="141" fill="#64748b" font-family="monospace" font-size="7">.think()</text>
    <text x="52" y="151" fill="#64748b" font-family="monospace" font-size="7">.code()</text>
    <text x="52" y="161" fill="#22c55e" font-family="monospace" font-size="7">.ship()</text>
    <rect x="95" y="157" width="4" height="8" fill="#3b82f6" class="blink" opacity="0.8"/>
  </g>

  <!-- ===== MINI TASK BOARD (right panel) ===== -->
  <g opacity="0.6">
    <rect x="640" y="95" width="120" height="75" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
    <rect x="640" y="95" width="120" height="14" rx="4" fill="#1e293b"/>
    <text x="676" y="105" fill="#94a3b8" font-family="monospace" font-size="7">TASKS</text>
    <!-- Task items -->
    <rect x="648" y="114" width="46" height="6" rx="1" fill="#22c55e" opacity="0.6" class="node-pulse"/>
    <text x="650" y="119" fill="#fff" font-family="monospace" font-size="4.5">DONE</text>
    <rect x="648" y="124" width="46" height="6" rx="1" fill="#3b82f6" opacity="0.6" class="node-pulse-d"/>
    <text x="650" y="129" fill="#fff" font-family="monospace" font-size="4.5">IN PROG</text>
    <rect x="648" y="134" width="46" height="6" rx="1" fill="#3b82f6" opacity="0.4" class="node-pulse-d2"/>
    <text x="650" y="139" fill="#fff" font-family="monospace" font-size="4.5">IN PROG</text>
    <rect x="648" y="144" width="46" height="6" rx="1" fill="#64748b" opacity="0.4"/>
    <text x="650" y="149" fill="#fff" font-family="monospace" font-size="4.5">TODO</text>
    <rect x="648" y="154" width="46" height="6" rx="1" fill="#64748b" opacity="0.3"/>
    <text x="650" y="159" fill="#fff" font-family="monospace" font-size="4.5">TODO</text>
    <!-- Progress bar -->
    <rect x="700" y="114" width="52" height="48" rx="2" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    <rect x="704" y="149" width="44" height="8" rx="1.5" fill="#1e293b"/>
    <rect x="704" y="149" width="18" height="8" rx="1.5" fill="#22c55e" opacity="0.7" class="node-pulse"/>
  </g>

  <!-- ===== MINI CHAT (bottom-left panel) ===== -->
  <g opacity="0.5">
    <rect x="65" y="290" width="130" height="55" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
    <text x="73" y="304" fill="#93c5fd" font-family="monospace" font-size="6.5">CEO → CTO:</text>
    <text x="73" y="314" fill="#94a3b8" font-family="monospace" font-size="6">"Ship the auth module"</text>
    <text x="73" y="326" fill="#c4b5fd" font-family="monospace" font-size="6.5">CTO → ENG-1:</text>
    <text x="73" y="336" fill="#94a3b8" font-family="monospace" font-size="6">"On it, PR incoming..."</text>
  </g>

  <!-- ===== MINI METRICS (bottom-right panel) ===== -->
  <g opacity="0.5">
    <rect x="610" y="290" width="130" height="55" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
    <text x="618" y="304" fill="#94a3b8" font-family="monospace" font-size="6.5">LIVE METRICS</text>
    <text x="618" y="316" fill="#22c55e" font-family="monospace" font-size="7" class="node-pulse">● 5 agents online</text>
    <text x="618" y="328" fill="#3b82f6" font-family="monospace" font-size="7" class="node-pulse-d">● 98 events/session</text>
    <text x="618" y="340" fill="#eab308" font-family="monospace" font-size="7" class="node-pulse-d2">● 3 tasks in-flight</text>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="400" y="38" text-anchor="middle" fill="url(#title-grad)" font-family="sans-serif" font-weight="900" font-size="32" letter-spacing="4" class="glow-b">VENTUREOS</text>
  <text x="400" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Mission Control for AI Agent Teams</text>

  <!-- ===== BOTTOM STATUS BAR ===== -->
  <rect x="0" y="370" width="800" height="30" fill="#0f172a" opacity="0.8"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#1e293b" stroke-width="0.5"/>
  <circle cx="20" cy="385" r="3" fill="#22c55e" class="node-pulse"/>
  <text x="30" y="388" fill="#64748b" font-family="monospace" font-size="8">SYSTEM ONLINE</text>
  <text x="200" y="388" fill="#475569" font-family="monospace" font-size="8">ws://localhost:3000</text>
  <text x="400" y="388" fill="#475569" font-family="monospace" font-size="8" text-anchor="middle">▸ think · talk · code · ship ◂</text>
  <text x="620" y="388" fill="#475569" font-family="monospace" font-size="8">event-sourced</text>
  <text x="760" y="388" fill="#3b82f6" font-family="monospace" font-size="8" text-anchor="end" class="node-pulse">v0.1.0</text>

  <!-- Corner decorations -->
  <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <path d="M 780 0 L 800 0 L 800 20" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  <path d="M 0 380 L 0 400 L 20 400" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <path d="M 780 400 L 800 400 L 800 380" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
</svg>
